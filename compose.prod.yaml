name: intrusion

services:
  redis:
    image: redis:8.2-alpine
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  website:
    container_name: intrusion-website
    ports: ["127.0.0.1:8150:8001"]
    image: ghcr.io/cmnemoi/intrusion:${IMAGE_TAG:-main}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
    restart: unless-stopped

volumes:
  redis-data:
